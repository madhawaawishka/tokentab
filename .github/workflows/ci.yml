name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint, typecheck, and the full unit-test suite. The test suite runs the
  # TypeScript sources directly via Node's type-stripping + node:sqlite, which
  # require Node >= 22, so it runs on the current LTS.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Verify the *built* package (plain JS targeting Node 18) actually works on
  # every supported runtime — this is what proves "green on Node 18/20/22".
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ matrix.node }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Smoke test built artifacts
        run: node test/smoke.mjs
